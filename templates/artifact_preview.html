<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title | default('PDF Document Preview') }}</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <!-- KaTeX for math rendering in artifact preview -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ],
      throwOnError : false
    });"></script>
  <style>
{{ pygments_css }}
/* Styling for preview rendered markdown */
.preview-content h1 { font-size: 1.5rem; font-weight: 700; margin: 1.2rem 0 0.6rem 0; border-bottom: 2px solid var(--border); padding-bottom: 0.3rem; }
.preview-content h2 { font-size: 1.25rem; font-weight: 600; margin: 1rem 0 0.5rem 0; border-bottom: 1px solid var(--border); padding-bottom: 0.2rem; }
.preview-content h3 { font-size: 1.1rem; font-weight: 600; margin: 0.8rem 0 0.4rem 0; }
.preview-content p { margin: 0.6rem 0; line-height: 1.6; }
.preview-content pre { background-color: rgba(0,0,0,0.06); padding: 0.8rem; border-radius: 0.5rem; overflow-x: auto; font-size: 0.85rem; margin: 0.8rem 0; }
.preview-content code:not(pre code) { background-color: rgba(0,0,0,0.06); padding: 0.15rem 0.35rem; border-radius: 0.25rem; font-size: 0.85rem; }
.preview-content table { width: 100%; border-collapse: collapse; margin: 0.8rem 0; font-size: 0.9rem; }
.preview-content th, .preview-content td { padding: 0.4rem 0.6rem; border: 1px solid var(--border); }
.preview-content th { background-color: rgba(0,0,0,0.04); font-weight: 600; }
.preview-content blockquote { border-left: 4px solid var(--primary); padding-left: 0.8rem; margin: 0.8rem 0; color: var(--muted-foreground); }
.preview-content ul, .preview-content ol { padding-left: 1.5rem; margin: 0.6rem 0; }
.preview-content li { margin: 0.25rem 0; }
{{ base_css }}
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-4">

  <!-- Main Container Card -->
  <div class="max-w-4xl mx-auto bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-2xl shadow-sm overflow-hidden flex flex-col">
    
    <!-- Top Action & Meta Header -->
    <div class="p-5 border-b border-[var(--border)] bg-opacity-50 flex flex-wrap items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200">
            PDF 排版就绪
          </span>
          <span class="text-xs text-[var(--muted-foreground)]">主题: {{ theme | default('modern') }}</span>
          <span class="text-xs text-[var(--muted-foreground)]">• {{ page_count | default('1') }} 页</span>
          <span class="text-xs text-[var(--muted-foreground)]">• {{ file_size_str | default('0 KB') }}</span>
        </div>
        <h1 class="text-xl font-bold mt-1 text-[var(--foreground)]">{{ title }}</h1>
        <p class="text-xs text-[var(--muted-foreground)] mt-0.5">{{ author | default('Antigravity') }} • {{ date }}</p>
      </div>

      <!-- Quick Action Buttons -->
      <div class="flex items-center gap-2">
        <a href="file:///{{ pdf_path | replace('\\', '/') }}" target="_blank"
           class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-medium bg-[var(--primary)] text-white hover:opacity-90 transition shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
          打开 PDF
        </a>
        <button onclick="copyPdfPath()"
                class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium border border-[var(--border)] text-[var(--foreground)] hover:bg-[var(--border)] transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
          </svg>
          <span id="copy-btn-text">复制路径</span>
        </button>
      </div>
    </div>

    <!-- PDF File Path Banner -->
    <div class="px-5 py-2.5 bg-black/5 dark:bg-white/5 border-b border-[var(--border)] flex items-center justify-between text-xs font-mono text-[var(--muted-foreground)]">
      <span class="truncate" title="{{ pdf_path }}">文件存储位置: {{ pdf_path }}</span>
    </div>

    <!-- Document Preview Content -->
    <div class="p-6 overflow-y-auto max-h-[750px] preview-content">
      {{ content_html | safe }}
    </div>

  </div>

  <script>
    function copyPdfPath() {
      const path = "{{ pdf_path | replace('\\', '\\\\') }}";
      navigator.clipboard.writeText(path).then(() => {
        const btn = document.getElementById('copy-btn-text');
        btn.innerText = '已复制!';
        setTimeout(() => { btn.innerText = '复制路径'; }, 2000);
      });
    }
  </script>
</body>
</html>
